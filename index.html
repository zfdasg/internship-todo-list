<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的待办清单</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>我的待办清单</h1>
    <p>把今天要做的事记下来，一件一件完成。</p>
    <form id="task-form">
      <label class="sr-only" for="task-input">待办内容</label>
      <input id="task-input" maxlength="100" placeholder="例如：完成实习课程作业" required>
      <button>添加</button>
    </form>
    <p id="summary" aria-live="polite"></p>
    <ul id="task-list"></ul>
    <p id="empty">还没有任务，添加第一件待办吧。</p>
    <button id="clear" type="button">清除已完成</button>
    <p class="note" id="storage-note">数据保存在当前浏览器中。</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
